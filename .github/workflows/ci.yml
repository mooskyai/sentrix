name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sentrix
          POSTGRES_USER: sentrix
          POSTGRES_PASSWORD: sentrix-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentrix -d sentrix"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_DB: sentrix
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: sentrix-ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --host 127.0.0.1 --user default --password=sentrix-ci --database sentrix --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "false"
      POSTGRES_DB: sentrix
      POSTGRES_USER: sentrix
      POSTGRES_PASSWORD: sentrix-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: sentrix
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: sentrix-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - working-directory: backend
        run: uv sync --group dev
      - working-directory: backend
        run: uv run ruff check .
      - working-directory: backend
        run: uv run ruff format --check .
      - working-directory: backend
        run: uv run mypy .
      - working-directory: backend
        run: uv run python manage.py check
      - working-directory: backend
        run: uv run python manage.py makemigrations --check --dry-run
      - working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build

  nextjs-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked Next.js fixture dependencies
        working-directory: integrations/m7-nextjs-node
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Next.js Node App Router fixture
        working-directory: integrations/m7-nextjs-node
        run: npm run build
      - name: Verify real Next.js route and fake OTLP protobuf receiver
        working-directory: integrations/m7-nextjs-node
        run: npm test
      - name: Audit production Next.js fixture dependencies
        working-directory: integrations/m7-nextjs-node
        run: npm audit --omit=dev --audit-level=moderate
