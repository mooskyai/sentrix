[project]
name = "sentrix-control-plane"
version = "0.1.0"
description = "Django control plane for Sentrix, a multi-tenant observability platform"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django>=6.1.1,<6.2",
  "djangorestframework>=3.18.1,<3.19",
  "django-cors-headers>=4.9,<5",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "clickhouse-connect>=0.9,<1",
  "opentelemetry-proto>=1.45,<2",
  "googleapis-common-protos>=1.75.5,<2",
  "uvicorn[standard]>=0.37,<1",
  "gunicorn>=23,<24",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
  "django-stubs[compatible-mypy]>=6.1.2,<6.2",
  "djangorestframework-stubs[compatible-mypy]>=3.18.1,<3.19",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --disable-warnings --maxfail=1"
markers = ["integration: requires live ClickHouse and HTTP infrastructure"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_ignores = true
exclude = [".*/migrations/.*"]

[tool.django-stubs]
django_settings_module = "config.settings"

[[tool.mypy.overrides]]
module = ["clickhouse_connect", "clickhouse_connect.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry.proto.*", "google.rpc.*"]
ignore_missing_imports = true
