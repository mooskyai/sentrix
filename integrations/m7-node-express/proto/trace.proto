syntax = "proto3";
package opentelemetry.proto.collector.trace.v1;
// Minimal field-number-compatible subset used to decode the real OTLP wire payload.
message ExportTraceServiceRequest { repeated ResourceSpans resource_spans = 1; }
message ResourceSpans { Resource resource = 1; repeated ScopeSpans scope_spans = 2; }
message Resource { repeated KeyValue attributes = 1; }
message KeyValue { string key = 1; AnyValue value = 2; }
message AnyValue { oneof value { string string_value = 1; } }
message ScopeSpans { repeated Span spans = 2; }
message Span {
  bytes trace_id = 1;
  bytes span_id = 2;
  string name = 5;
  int32 kind = 6;
  // OTLP Span uses wire type 1 (64-bit), NOT varints (wire type 0).
  // A uint64 declaration causes protobufjs to lose alignment decoding SDK spans.
  fixed64 start_time_unix_nano = 7;
  fixed64 end_time_unix_nano = 8;
  repeated KeyValue attributes = 9;
}
